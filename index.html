<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapzer | Under Development</title>
    <style>
        /* Basic reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #000; /* black background */
            color: #fff; /* white text */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo {
            font-family: "Cambria Math", Cambria, serif;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 0.5em;
            color: #fff;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0.5em;
            font-weight: normal;
        }

        p {
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 1.5em;
        }

        .social-links {
            display: flex;
            gap: 1.5em;
        }

        .social-links a {
            display: flex;
            align-items: center;
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #ff9900;
        }

        .social-links svg {
            width: 24px;
            height: 24px;
            margin-right: 0.5em;
            fill: currentColor;
        }

        @media (max-width: 600px) {
            .logo { font-size: 2.2em; }
            h1 { font-size: 2em; }
            p { font-size: 1em; }
            .social-links svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>
    <div class="logo">Synapzer</div>
    <h1>🚧 Under Development</h1>
    <p>Our website is currently under development. Check back soon!</p>
    <div class="social-links">

            X

        <a href="https://www.linkedin.com/in/paranavithana" target="_blank">
